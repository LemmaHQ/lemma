<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lemma</title>
        <script>
            (function () {
                try {
                    var pref = localStorage.getItem("lemma.theme") || "system";
                    var dark =
                        pref === "dark" ||
                        (pref === "system" &&
                            window.matchMedia("(prefers-color-scheme: dark)")
                                .matches);
                    document.documentElement.classList.toggle("dark", dark);
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root">
            <div class="grid min-h-dvh place-items-center">
                <span
                    class="font-serif text-xl font-semibold text-muted-foreground motion-safe:animate-pulse"
                >
                    Lemma
                </span>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
