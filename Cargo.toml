[workspace]
members = [
    "crates/daemon/lemma-daemon",
    "crates/shared/lemma-proto",
    "crates/shared/lemma-provider",
    "crates/shared/lemma-session",
    "crates/shared/lemma-engine",
    "crates/shared/lemma-rpc",
    "crates/shared/lemma-crypto",
    "crates/shared/lemma-core",
    "crates/shared/lemma-db",
    "crates/shared/lemma-adapter",
    "crates/shared/lemma-agent",
    "crates/shared/lemma-agent-loop",
    "crates/shared/lemma-model",
    "crates/shared/lemma-tool",
    "crates/mobile/lemma-mobile",
    "crates/desktop/lemma-desktop",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "0.11.1"
axum = "0.8.9"
base64 = "0.23.1"
buffa = { version = "0.9.1", features = ["json"] }
buffa-types = { version = "0.9.1", features = ["json", "chrono"] }
chrono = { version = "0.4.45", features = ["serde"] }
connectrpc = { version = "0.9.0", features = ["server", "axum"] }
connectrpc-build = "0.9.0"
dashmap = "6.2.1"
dotenvy = "0.15.7"
dunce = "1.0.5"
futures = "0.3.34"
hex = "0.4.3"
jni = "0.22.4"
lemma-adapter = { path = "crates/shared/lemma-adapter" }
lemma-agent = { path = "crates/shared/lemma-agent" }
lemma-agent-loop = { path = "crates/shared/lemma-agent-loop" }
lemma-db = { path = "crates/shared/lemma-db" }
lemma-session = { path = "crates/shared/lemma-session" }
lemma-crypto = { path = "crates/shared/lemma-crypto" }
lemma-engine = { path = "crates/shared/lemma-engine" }
lemma-rpc = { path = "crates/shared/lemma-rpc" }
lemma-proto = { path = "crates/shared/lemma-proto" }
lemma-provider = { path = "crates/shared/lemma-provider" }
lemma-tool = { path = "crates/shared/lemma-tool" }
lemma-core = { path = "crates/shared/lemma-core" }
lemma-model = { path = "crates/shared/lemma-model" }
libc = "0.2.189"
napi = { version = "3.15.0", features = ["async"] }
napi-build = "2.6.0"
napi-derive = "3.6.13"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
rustls-platform-verifier = "0.7.0"
sqlx = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
    "uuid",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
uniffi = { version = "0.32.2", features = ["tokio"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }

[workspace.lints.clippy]
absolute_paths = "deny"
doc_markdown = "deny"
expect_used = "deny"
fn_params_excessive_bools = "deny"
format_push_string = "deny"
implicit_clone = "deny"
missing_assert_message = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
must_use_candidate = "deny"
needless_for_each = "deny"
needless_pass_by_value = "deny"
redundant_clone = "deny"
ref_option = "deny"
return_self_not_must_use = "deny"
single_char_lifetime_names = "deny"
string_add = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

[workspace.lints.rust]
linker_messages = "allow"
missing_debug_implementations = "deny"
missing_docs = "deny"
