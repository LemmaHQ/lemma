[workspace]
members = [
    "crates/server/lemma-server",
    "crates/shared/lemma-db-sqlite",
    "crates/server/lemma-db-pgsql",
    "crates/shared/lemma-proto",
    "crates/server/lemma-auth",
    "crates/shared/lemma-provider",
    "crates/shared/lemma-conversation",
    "crates/server/rpc/lemma-agent-rpc",
    "crates/server/rpc/lemma-provider-rpc",
    "crates/shared/lemma-crypto",
    "crates/shared/lemma-core",
    "crates/shared/lemma-adapter",
    "crates/shared/lemma-agent",
    "crates/shared/lemma-session",
    "crates/shared/lemma-tools",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
buffa = { version = "0.9.1", features = ["json"] }
buffa-types = { version = "0.9.1", features = ["json", "chrono"] }
chrono = { version = "0.4.45", features = ["serde"] }
connectrpc = { version = "0.9.0", features = ["server", "axum"] }
connectrpc-build = "0.9.0"
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
lemma-adapter = { path = "crates/shared/lemma-adapter" }
lemma-agent = { path = "crates/shared/lemma-agent" }
lemma-auth = { path = "crates/server/lemma-auth" }
lemma-conversation = { path = "crates/shared/lemma-conversation" }
lemma-crypto = { path = "crates/shared/lemma-crypto" }
lemma-db-pgsql = { path = "crates/server/lemma-db-pgsql" }
lemma-db-sqlite = { path = "crates/shared/lemma-db-sqlite" }
lemma-proto = { path = "crates/shared/lemma-proto" }
lemma-provider = { path = "crates/shared/lemma-provider" }
lemma-agent-rpc = { path = "crates/server/rpc/lemma-agent-rpc" }
lemma-provider-rpc = { path = "crates/server/rpc/lemma-provider-rpc" }
lemma-session = { path = "crates/shared/lemma-session" }
lemma-tools = { path = "crates/shared/lemma-tools" }
lemma-core = { path = "crates/shared/lemma-core" }
parking_lot = "0.12.5"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = [
    "postgres",
    "sqlite",
    "runtime-tokio",
    "tls-rustls",
    "migrate",
    "macros",
    "uuid",
    "chrono",
    "json",
] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }

[workspace.lints.clippy]
expect_used = "warn"
unwrap_used = "deny"

[workspace.lints.rust]
linker_messages = "allow"
missing_docs = "deny"
