name: A turn with tool calls runs iteratively to completion
given:
  - a conversation exists with configured tools
  - the user sends a message requesting an action
when:
  - the model returns a tool call request
then:
  - the system emits a tool call started event
  - the system executes the tool in the workspace environment
  - the system emits a tool call finished event
  - a tool result row is committed to the session tree under the assistant turn
  - the system re-invokes the model with the tool result until a terminal text response is produced
