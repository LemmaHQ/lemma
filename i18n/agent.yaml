agent:
  abortedNotice:
    platforms: [web, android]
    en: "Generation stopped."
    zh: "生成已停止。"
  stop:
    platforms: [web, android]
    en: "Stop generating"
    zh: "停止生成"
  reconnecting:
    platforms: [web]
    params: { offset: number }
    en: "Connection interrupted, resuming from event {offset}…"
    zh: "连接中断，正在从第 {offset} 个事件续传…"
  runningTool:
    platforms: [web]
    params: { name: string }
    en: "Running {name}…"
    zh: "正在运行 {name}…"
  selfHealed:
    platforms: [web]
    en: "Failed · fixed later"
    zh: "失败 · 已修复"
  stepCount:
    platforms: [web]
    plural: count
    params: { count: number }
    en:
      one: "{count} step"
      other: "{count} steps"
    zh:
      other: "{count} 步"
  stopShort:
    platforms: [web]
    en: "Stop"
    zh: "停止"
  summaryFetchedWeb:
    platforms: [web]
    en: "fetched page"
    zh: "抓取网页"
  summaryRan:
    platforms: [web]
    params: { target: string }
    en: "ran {target}"
    zh: "执行 {target}"
  summaryRead:
    platforms: [web]
    params: { target: string }
    en: "read {target}"
    zh: "读了 {target}"
  summarySearchedWeb:
    platforms: [web]
    en: "searched the web"
    zh: "搜索网页"
  summaryWrote:
    platforms: [web]
    params: { target: string }
    en: "wrote {target}"
    zh: "写了 {target}"
  thinking:
    platforms: [web, android]
    en: "Thought"
    zh: "已思考"
  thinkingInProgress:
    platforms: [web, android]
    en: "Thinking…"
    zh: "正在思考…"
  thinkingPending:
    platforms: [web, android]
    en: "Thinking"
    zh: "正在思考"
  thoughtFor:
    platforms: [web, android]
    params: { duration: string }
    en: "Thought for {duration}"
    zh: "思考了 {duration}"
  thoughtDuration:
    platforms: [web]
    params: { duration: string }
    en: "Thought {duration}"
    zh: "思考 {duration}"
  toolCall:
    announce:
      error:
        platforms: [web, android]
        params: { name: string, error: string }
        en: "{name} failed: {error}"
        zh: "{name} 失败：{error}"
      running:
        platforms: [web, android]
        params: { name: string }
        en: "{name} running"
        zh: "{name} 正在运行"
      success:
        platforms: [web, android]
        params: { name: string }
        en: "{name} finished"
        zh: "{name} 已完成"
    arguments:
      platforms: [web, android]
      en: "Arguments"
      zh: "参数"
    copyArguments:
      platforms: [web, android]
      en: "Copy arguments"
      zh: "复制参数"
    copyResult:
      platforms: [web, android]
      en: "Copy result"
      zh: "复制结果"
    errorFallback:
      platforms: [web, android]
      en: "The tool call failed."
      zh: "工具调用失败"
    failed:
      platforms: [web, android]
      en: "Failed"
      zh: "失败"
    output:
      platforms: [web, android]
      en: "Result"
      zh: "结果"
    showAll:
      platforms: [web, android]
      en: "Show all"
      zh: "展开全部"
    showLess:
      platforms: [web, android]
      en: "Show less"
      zh: "收起"
    waiting:
      platforms: [web, android]
      en: "Waiting for result…"
      zh: "等待结果…"
  toolGroup:
    failed:
      platforms: [web, android]
      params: { count: number }
      en: "{count} failed"
      zh: "{count} 个失败"
    running:
      platforms: [web, android]
      plural: count
      params: { count: number }
      en:
        one: "Using {count} tool…"
        other: "Using {count} tools…"
      zh:
        other: "正在使用 {count} 个工具…"
    used:
      platforms: [web, android]
      plural: count
      params: { count: number }
      en:
        one: "Used {count} tool"
        other: "Used {count} tools"
      zh:
        other: "使用了 {count} 个工具"
  verbBash:
    platforms: [web]
    en: "bash"
    zh: "终端"
  verbCode:
    platforms: [web]
    en: "code"
    zh: "代码"
  verbFetch:
    platforms: [web]
    en: "fetch"
    zh: "抓取"
  verbRead:
    platforms: [web]
    en: "read"
    zh: "读取"
  verbSearch:
    platforms: [web]
    en: "search"
    zh: "搜索"
  verbWrite:
    platforms: [web]
    en: "write"
    zh: "写入"
