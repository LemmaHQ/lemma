name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Dependabot runs get a read-only token, so the SARIF upload would 403;
    # those PRs are covered by the push scan right after merge.
    if: github.actor != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
          - language: actions
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v7

      - name: Setup mobile toolchain
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup-mobile

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # Kotlin is extracted only from a traced compilation: no build cache,
      # and the compiler runs inside the traced Gradle process.
      - name: Build Kotlin
        if: matrix.language == 'java-kotlin'
        run: just mobile-android-test --no-build-cache --no-daemon -Pkotlin.compiler.execution.strategy=in-process

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
