name: Rust CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "proto/**"
      - "justfile"
      - "mise.toml"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "proto/**"
      - "justfile"
      - "mise.toml"
      - ".github/workflows/rust-ci.yml"

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # lemma-daemon embeds web/dist (a gitignored build artifact) via RustEmbed,
  # so the real frontend is built first; clippy/test fetch it via artifact.
  web-dist:
    name: Web dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node buf just

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: just web-build

      - name: Upload web/dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: just mr-boxington

      - name: Format
        run: just rust-fmt-check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: web-dist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Download web/dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: protobuf just mr-boxington

      - name: Rust cache
        uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: clippy

      - name: Clippy
        run: just rust-lint-check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: web-dist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Download web/dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-binstall
        uses: jdx/mise-action@v4
        with:
          install_args: cargo:cargo-binstall

      - name: Setup mise tools
        uses: jdx/mise-action@v4
        with:
          install_args: protobuf cargo:cargo-nextest just mr-boxington

      - name: Rust cache
        uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: test

      - name: Test
        run: just rust-test

  check:
    name: check
    runs-on: ubuntu-latest
    needs:
      - fmt
      - clippy
      - test
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.fmt.result }}" != "success" ] || \
             [ "${{ needs.clippy.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "Rust CI failed"
            exit 1
          fi
