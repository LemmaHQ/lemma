name: Spec CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "proto/**"
      - "design/**"
      - "i18n/**"
      - "docs/**"
      - "scripts/**"
      - "**/*.md"
      - "**/*.i18n.yaml"
      - ".markdownlint*"
      - ".autocorrect*"
      - "justfile"
      - "mise.toml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - ".oxlintrc.json"
      - ".github/workflows/spec-ci.yml"
  pull_request:
    paths:
      - "proto/**"
      - "design/**"
      - "i18n/**"
      - "docs/**"
      - "scripts/**"
      - "**/*.md"
      - "**/*.i18n.yaml"
      - ".markdownlint*"
      - ".autocorrect*"
      - "justfile"
      - "mise.toml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - ".oxlintrc.json"
      - ".github/workflows/spec-ci.yml"

concurrency:
  group: spec-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: buf just

      - name: Lint
        run: just proto-lint-check

      - name: Format check
        run: just proto-fmt-check

      - name: Build
        run: just proto-build

  design:
    name: Design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node just

      - name: Generate design tokens
        run: just design-gen

  i18n:
    name: I18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node just

      - name: Install dependencies
        run: npm ci --workspaces=false

      - name: Generate client strings
        run: just i18n-gen

      - name: Test source validation and rendering
        run: just i18n-test

  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node just

      - name: Install dependencies
        run: npm ci --workspaces=false

      - name: Lint docs formatting
        run: just docs-lint-check

      - name: Check translation pairs
        run: just docs-pairing-check

      - name: Check repository references
        run: just docs-refs-check

      - name: Type-check scripts
        run: just scripts-type-check

      - name: Lint scripts
        run: just scripts-lint-check

  check:
    name: check
    runs-on: ubuntu-latest
    needs:
      - proto
      - design
      - i18n
      - docs-lint
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.proto.result }}" != "success" ] || \
             [ "${{ needs.design.result }}" != "success" ] || \
             [ "${{ needs.i18n.result }}" != "success" ] || \
             [ "${{ needs.docs-lint.result }}" != "success" ]; then
            echo "Spec CI failed"
            exit 1
          fi
