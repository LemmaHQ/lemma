name: Spec CI

on:
  push:
    branches:
      - main
    paths:
      - "proto/**"
      - "design/**"
      - "docs/**"
      - "scripts/**"
      - "**/*.md"
      - "**/*.i18n.yaml"
      - ".markdownlint*"
      - ".autocorrect*"
      - ".github/workflows/spec-ci.yml"
  pull_request:
    paths:
      - "proto/**"
      - "design/**"
      - "docs/**"
      - "scripts/**"
      - "**/*.md"
      - "**/*.i18n.yaml"
      - ".markdownlint*"
      - ".autocorrect*"
      - ".github/workflows/spec-ci.yml"

concurrency:
  group: spec-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: buf

      - name: Lint
        run: cd proto && buf lint

      - name: Build
        run: cd proto && buf build

  design:
    name: Design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node

      - name: Generate design tokens
        run: node design/gen-tokens.mjs

  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node

      - name: Install dependencies
        run: npm ci --workspaces=false

      - name: Lint docs formatting
        run: npm run lint:docs

      - name: Check translation pairs
        run: node scripts/verify-translation-pairing.mjs

  check:
    name: check
    runs-on: ubuntu-latest
    needs:
      - proto
      - design
      - docs-lint
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.proto.result }}" != "success" ] || \
             [ "${{ needs.design.result }}" != "success" ] || \
             [ "${{ needs.docs-lint.result }}" != "success" ]; then
            echo "Spec CI failed"
            exit 1
          fi
