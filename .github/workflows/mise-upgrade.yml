name: mise-upgrade
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mise-upgrade
  cancel-in-progress: false

env:
  MISE_MINIMUM_RELEASE_AGE: 24h

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pre-install Rust components
        run: rustup component add rustfmt clippy llvm-tools-preview

      - name: Install cargo-binstall
        uses: jdx/mise-action@v4
        with:
          install_args: cargo:cargo-binstall

      - name: Install remaining tools
        uses: jdx/mise-action@v4
        with:
          install_args: node just buf protobuf cargo:sqlx-cli cargo:cargo-llvm-cov cargo:cargo-nextest

      - name: Bump pinned versions
        run: mise upgrade --bump node just buf protobuf cargo:sqlx-cli cargo:cargo-llvm-cov cargo:cargo-nextest cargo:cargo-binstall

      - name: Sync Dockerfile node base image
        run: |
          NODE_VERSION=$(sed -nE 's/^[ "]*(node)[ "]*= *"([^"]+)".*/\2/p' mise.toml)
          sed -i -E "s/^(ARG NODE_VERSION=).*/\1${NODE_VERSION}/" Dockerfile

      - name: Open update PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.MISE_UPGRADE_PAT }}
          branch: chore/mise-upgrade
          delete-branch: true
          commit-message: "chore: bump mise tool versions"
          title: "chore: bump mise tool versions"
          body: |
            Bumps tool versions pinned in `mise.toml` to latest.

            Local mise, CI mise-action, and the Dockerfile all read this single file.
            The Dockerfile `ARG NODE_VERSION` default is synced automatically in this PR.
