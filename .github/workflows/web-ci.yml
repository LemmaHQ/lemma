name: Web CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "design/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".oxlintrc.json"
      - ".prettierrc.json"
      - "justfile"
      - "mise.toml"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "design/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".oxlintrc.json"
      - ".prettierrc.json"
      - "justfile"
      - "mise.toml"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node buf just

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: just web-fmt-check

      - name: Lint
        run: just web-lint-check

      - name: Build
        run: just web-build

      - name: Test
        run: just web-test
