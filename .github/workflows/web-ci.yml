name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node buf

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      # Generated code is not committed; regenerate it first.
      # web/src/gen is excluded from prettier/eslint.
      - name: Generate proto code
        run: npm run gen:proto

      - name: Format check
        run: npm run format:check -w web

      - name: Lint
        run: npm run lint -w web

      - name: Build
        run: npm run build -w web

      - name: Test
        run: npm run test -w web
