name: KMP CI

on:
  push:
    branches:
      - main
    paths:
      - "kmp/**"
      - "proto/**"
      - ".github/workflows/kmp-ci.yml"
  pull_request:
    paths:
      - "kmp/**"
      - "proto/**"
      - ".github/workflows/kmp-ci.yml"

concurrency:
  group: kmp-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # 生成物不入 git，:client 的源码目录靠这一步产出
      - name: Generate proto code
        run: cd proto && buf generate --template buf.gen.kmp.yaml

      - name: Build
        run: ./gradlew assemble
        working-directory: kmp

      - name: Test
        run: ./gradlew jvmTest
        working-directory: kmp
