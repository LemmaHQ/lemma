name: Dead Code CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "desktop/**"
      - "packages/**"
      - "scripts/**"
      - "design/**"
      - "i18n/**"
      - "proto/**"
      - "knip.json"
      - "justfile"
      - "mise.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deadcode-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "desktop/**"
      - "packages/**"
      - "scripts/**"
      - "design/**"
      - "i18n/**"
      - "proto/**"
      - "knip.json"
      - "justfile"
      - "mise.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deadcode-ci.yml"

concurrency:
  group: deadcode-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deadcode:
    name: Dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node buf just

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Check unused code
        run: just deadcode-check

  check:
    name: check
    runs-on: ubuntu-latest
    needs:
      - deadcode
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.deadcode.result }}" != "success" ]; then
            echo "Dead Code CI failed"
            exit 1
          fi
