name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "crates/shared/**"
      - "crates/mobile/**"
      - "proto/**"
      - "design/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "mise.toml"
      - ".github/actions/setup-mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "crates/shared/**"
      - "crates/mobile/**"
      - "proto/**"
      - "design/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "mise.toml"
      - ".github/actions/setup-mobile/**"
      - ".github/workflows/mobile-ci.yml"

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mobile toolchain
        uses: ./.github/actions/setup-mobile

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Format check
        run: just mobile-fmt-check

      - name: Lint
        run: just mobile-android-lint-check

      - name: Test
        run: just mobile-android-test

      - name: Build
        run: just mobile-android-build

  # The host build that generates the UniFFI bindings picks the library
  # file per operating system, so the tests also run on Windows and macOS.
  test-platforms:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup mobile toolchain
        uses: ./.github/actions/setup-mobile

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: just mobile-android-test

  check:
    name: check
    runs-on: ubuntu-latest
    needs:
      - android
      - test-platforms
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.android.result }}" != "success" ] || \
             [ "${{ needs.test-platforms.result }}" != "success" ]; then
            echo "Mobile CI failed"
            exit 1
          fi
