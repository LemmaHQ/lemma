name: Duplication CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "web/src/**"
      - "desktop/src/**"
      - "mobile/**"
      - "scripts/**"
      - "design/**"
      - ".jscpd.json"
      - "justfile"
      - "mise.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dup-ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "web/src/**"
      - "desktop/src/**"
      - "mobile/**"
      - "scripts/**"
      - "design/**"
      - ".jscpd.json"
      - "justfile"
      - "mise.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dup-ci.yml"

concurrency:
  group: dup-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dup:
    name: Duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node just

      - name: Install dependencies
        run: npm ci --workspaces=false

      - name: Check duplicated code
        run: just dup-check

  check:
    name: check
    runs-on: ubuntu-latest
    needs:
      - dup
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.dup.result }}" != "success" ]; then
            echo "Duplication CI failed"
            exit 1
          fi
