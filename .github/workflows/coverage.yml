name: Coverage

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:pg18
        env:
          POSTGRES_DB: lemma-db
          POSTGRES_USER: lemma
          POSTGRES_PASSWORD: lemma
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U lemma -d lemma-db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgres://lemma:lemma@127.0.0.1:5432/lemma-db
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: jdx/mise-action@v4
        with:
          install_args: cargo:cargo-binstall

      - name: Setup mise tools
        uses: jdx/mise-action@v4
        with:
          install_args: protobuf cargo:cargo-nextest cargo:cargo-llvm-cov just

      - name: Coverage
        # NEXTEST_PROFILE selects the ci profile, which also writes JUnit
        # XML for the test-results upload below.
        run: just rust-cov --lcov --output-path lcov.info
        env:
          NEXTEST_PROFILE: ci

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          flags: rust
          report_type: test_results

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node buf just

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      # Generated code is not committed; regenerate it first.
      - name: Generate proto code
        run: just proto-gen

      - name: Coverage
        # The junit reporter emits web/junit.xml for the test-results
        # upload below; the default reporter keeps the console log.
        run: just web-cov --reporter=default --reporter=junit --outputFile.junit=junit.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: web

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/junit.xml
          flags: web
          report_type: test_results

      # Bundle analysis uploads inside `vite build`; without the token env
      # the plugin stays a no-op.
      - name: Build with bundle analysis
        run: just web-build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node just

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Coverage
        run: just desktop-cov --reporter=default --reporter=junit --outputFile.junit=junit.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: desktop/coverage/lcov.info
          flags: desktop

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: desktop/junit.xml
          flags: desktop
          report_type: test_results

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mobile toolchain
        uses: ./.github/actions/setup-mobile

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Coverage
        run: just mobile-android-cov

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: mobile/androidApp/build/reports/kover/report.xml
          flags: mobile
