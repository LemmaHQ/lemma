name: Desktop CI

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "web/**"
      - "design/**"
      - "package.json"
      - "package-lock.json"
      - "justfile"
      - "mise.toml"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "web/**"
      - "design/**"
      - "package.json"
      - "package-lock.json"
      - "justfile"
      - "mise.toml"
      - ".github/workflows/desktop-ci.yml"

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node buf just

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      # The renderer build compiles web/, which imports the generated
      # contract code.
      - name: Generate proto code
        run: just proto-gen

      - name: Generate design tokens
        run: just design-gen

      - name: Format check
        run: just desktop-fmt-check

      - name: Lint
        run: just desktop-lint-check

      - name: Build
        run: just desktop-build

      - name: Test
        run: just desktop-test
