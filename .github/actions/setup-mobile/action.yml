name: Setup mobile toolchain
description: Install the tools and script dependencies the Android build runs.

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install

    - name: Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-binstall
      uses: jdx/mise-action@v4
      with:
        install_args: cargo:cargo-binstall

    - name: Setup mise tools
      uses: jdx/mise-action@v4
      with:
        install_args: java node buf protobuf just cargo:cargo-ndk

    - name: Install script dependencies
      shell: bash
      run: npm ci --workspaces=false
