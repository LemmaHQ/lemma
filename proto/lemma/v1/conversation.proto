syntax = "proto3";

package lemma.v1;

import "google/protobuf/timestamp.proto";

// Message lifecycle status.
enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_STREAMING = 1;
  MESSAGE_STATUS_DONE = 2;
  MESSAGE_STATUS_ABORTED = 3;
  MESSAGE_STATUS_ERROR = 4;
}

message Conversation {
  reserved 3, 4;
  reserved "status", "archived_at";

  string id = 1;
  string title = 2;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// Tool call block within an assistant message.
message ToolCall {
  string id = 1;
  string name = 2;
  // Invocation arguments formatted as serialized JSON text.
  string arguments = 3;
}

// Tool execution metadata for tool-role messages; payload text resides in content.
message ToolResultMeta {
  string tool_call_id = 1;
  string name = 2;
  bool is_error = 3;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  string role = 3; // user | assistant | system | tool
  string content = 4;
  // Originating provider and model for assistant messages.
  string provider_id = 5;
  string model = 6;
  MessageStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Parent node in the message tree; empty for root messages.
  string parent_id = 10;
  // Full chain-of-thought text concatenated from thinking blocks when produced by the model.
  string thinking = 11;
  // Error description populated when status is set to error.
  string error = 12;
  // Tool call requests issued within an assistant message.
  repeated ToolCall tool_calls = 13;
  // Tool execution result metadata present on tool-role messages.
  ToolResultMeta tool_result = 14;
}

message ListConversationsRequest {}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

message CreateConversationRequest {}

message CreateConversationResponse {
  Conversation conversation = 1;
}

message RenameConversationRequest {
  string id = 1;
  string title = 2;
}

message RenameConversationResponse {
  Conversation conversation = 1;
}

message ListMessagesRequest {
  string conversation_id = 1;
  // Keyset pagination anchor using (created_at, id); omitted to start from the beginning.
  string before_id = 2;
  int32 limit = 3;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  // Indicates presence of earlier messages in the history timeline.
  bool has_more = 2;
}

message DeleteConversationRequest {
  string id = 1;
}

message DeleteConversationResponse {}

service ConversationService {
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc RenameConversation(RenameConversationRequest) returns (RenameConversationResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  // Permanently deletes a conversation and all of its messages.
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
}
