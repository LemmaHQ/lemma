syntax = "proto3";

package lemma.v1;

import "google/protobuf/timestamp.proto";

message User {
  reserved 4;
  reserved "role";

  string id = 1;
  string username = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 5;
}

// Token pair: short-lived access token and database-backed revokable refresh token.
message AuthTokens {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expires_at = 2;
  string refresh_token = 3;
}

message SignUpRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message SignUpResponse {
  User user = 1;
  AuthTokens tokens = 2;
}

message LoginRequest {
  reserved 1, 2;
  reserved "username", "email";

  // Username or email of the account.
  string login = 4;
  string password = 3;
}

message LoginResponse {
  User user = 1;
  AuthTokens tokens = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  AuthTokens tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  User user = 1;
}

service AuthService {
  // Registers a new user account.
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  // Token rotation: revokes the previous refresh token and issues a new pair.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  // Revokes the active refresh token session.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Me(MeRequest) returns (MeResponse);
}
