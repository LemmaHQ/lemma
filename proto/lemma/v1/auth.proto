syntax = "proto3";

package lemma.v1;

message User {
  reserved 3 to 5;
  reserved "email", "role", "created_at";

  string id = 1;
  string username = 2;
}

// Token pair: short-lived access token and database-backed revokable refresh token.
message AuthTokens {
  reserved 2;
  reserved "access_token_expires_at";

  string access_token = 1;
  string refresh_token = 3;
}

message SignUpRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message SignUpResponse {
  User user = 1;
  AuthTokens tokens = 2;
}

message LoginRequest {
  reserved 1, 2;
  reserved "username", "email";

  // Username or email of the account.
  string login = 4;
  string password = 3;
}

message LoginResponse {
  User user = 1;
  AuthTokens tokens = 2;
}

message CheckAccountRequest {
  // Username or email of the account.
  string login = 1;
}

message CheckAccountResponse {
  bool exists = 1;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  AuthTokens tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  User user = 1;
}

service AuthService {
  // Registers a new user account.
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  // Reports whether an account with the username or email exists, so a client can route to sign-in or sign-up.
  rpc CheckAccount(CheckAccountRequest) returns (CheckAccountResponse);
  // Token rotation: revokes the previous refresh token and issues a new pair.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  // Revokes the active refresh token session.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Me(MeRequest) returns (MeResponse);
}
