syntax = "proto3";

package lemma.v1;

message User {
  string id = 1;
  string username = 2;
}

// Token pair: short-lived access token and database-backed revokable refresh token.
message AuthTokens {
  string access_token = 1;
  string refresh_token = 3;
}

message SignUpRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message SignUpResponse {
  User user = 1;
  AuthTokens tokens = 2;
}

message SignInRequest {
  // Username or email of the account.
  string identifier = 4;
  string password = 3;
}

message SignInResponse {
  User user = 1;
  AuthTokens tokens = 2;
}

message CheckAccountRequest {
  // Username or email of the account.
  string identifier = 1;
}

message CheckAccountResponse {
  bool exists = 1;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  AuthTokens tokens = 1;
}

message SignOutRequest {
  string refresh_token = 1;
}

message SignOutResponse {}

message MeRequest {}

message MeResponse {
  User user = 1;
}

service AuthService {
  // Registers a new user account.
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  rpc SignIn(SignInRequest) returns (SignInResponse);
  // Reports whether an account with the username or email exists, so a client can route to sign-in or sign-up.
  rpc CheckAccount(CheckAccountRequest) returns (CheckAccountResponse);
  // Token rotation: revokes the previous refresh token and issues a new pair.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  // Revokes the presented refresh token, ending its token family.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc Me(MeRequest) returns (MeResponse);
}
