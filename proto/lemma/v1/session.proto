syntax = "proto3";

package lemma.v1;

import "google/protobuf/timestamp.proto";

// Message lifecycle status.
enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_STREAMING = 1;
  MESSAGE_STATUS_DONE = 2;
  MESSAGE_STATUS_ABORTED = 3;
  MESSAGE_STATUS_ERROR = 4;
}

message Session {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp updated_at = 7;
}

// Tool call block within an assistant message.
message ToolCall {
  string id = 1;
  string name = 2;
  // Invocation arguments formatted as serialized JSON text.
  string arguments = 3;
  // Server instant at which tool execution started; absent in older rows.
  google.protobuf.Timestamp started_at = 4;
  // Server instant at which the tool result arrived; absent while running.
  google.protobuf.Timestamp finished_at = 5;
}

// Tool execution metadata for tool-role messages; payload text resides in content.
message ToolResultMeta {
  string tool_call_id = 1;
  bool is_error = 3;
}

message Message {
  string id = 1;
  string role = 3; // user | assistant | system | tool
  string content = 4;
  // Originating provider and model for assistant messages.
  string provider_id = 5;
  string model = 6;
  MessageStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Full chain-of-thought text concatenated from thinking blocks when produced by the model.
  string thinking = 11;
  // Error description populated when status is set to error.
  string error = 12;
  // Tool call requests issued within an assistant message.
  repeated ToolCall tool_calls = 13;
  // Tool execution result metadata present on tool-role messages.
  ToolResultMeta tool_result = 14;
  // Server instant of the first thinking delta; absent in older rows.
  google.protobuf.Timestamp thinking_started_at = 15;
  // Server instant of the first non-thinking event after thinking began.
  google.protobuf.Timestamp thinking_finished_at = 16;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message CreateSessionRequest {}

message CreateSessionResponse {
  Session session = 1;
}

message RenameSessionRequest {
  string id = 1;
  string title = 2;
}

message RenameSessionResponse {
  Session session = 1;
}

message ListMessagesRequest {
  string session_id = 1;
  // Keyset pagination anchor using (created_at, id); omitted to start from the beginning.
  string before_id = 2;
  int32 limit = 3;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  // Indicates presence of earlier messages in the history timeline.
  bool has_more = 2;
}

message DeleteSessionRequest {
  string id = 1;
}

message DeleteSessionResponse {}

service SessionService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc RenameSession(RenameSessionRequest) returns (RenameSessionResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  // Permanently deletes a session and all of its messages.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
}
