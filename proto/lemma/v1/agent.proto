syntax = "proto3";

package lemma.v1;

import "google/protobuf/timestamp.proto";

// Agent execution: send message (server stream), abort, and stream resumption.
service AgentService {
  rpc SendMessage(SendMessageRequest) returns (stream SendMessageResponse);
  rpc AbortMessage(AbortMessageRequest) returns (AbortMessageResponse);
  rpc ResumeStream(ResumeStreamRequest) returns (stream ResumeStreamResponse);
}

message AgentStarted {
  reserved 2;
  reserved "client_msg_id";

  string message_id = 1;
}

message TextDelta {
  string content = 1;
}

message ThinkingDelta {
  string content = 1;
}

// Structured stream delta: yields one part per event for client-side accumulation by part type.
message AgentDelta {
  oneof part {
    TextDelta text = 1;
    ThinkingDelta thinking = 2;
  }
}

message AgentDone {
  reserved 1;
  reserved "usage";
}

message AgentAborted {}

message AgentError {
  string message = 1;
}

// Marks the start of an assistant turn, emitted per iteration in tool execution loops.
message AgentTurnStarted {
  string message_id = 1;
}

message ToolCallStarted {
  string call_id = 1;
  string name = 2;
  // Invocation arguments formatted as serialized JSON text.
  string arguments = 3;
}

message ToolCallFinished {
  reserved 2;
  reserved "name";

  string call_id = 1;
  // Tool execution output text.
  string content = 3;
  bool is_error = 4;
}

// Unified stream event.
message AgentEvent {
  oneof kind {
    AgentStarted started = 1;
    AgentDelta delta = 2;
    AgentDone done = 3;
    AgentAborted aborted = 4;
    AgentError error = 5;
    AgentTurnStarted turn_started = 6;
    ToolCallStarted tool_call_started = 7;
    ToolCallFinished tool_call_finished = 8;
  }
  // Server instant at which this event occurred. For thinking, the first
  // thinking delta starts the interval and the first text delta, tool call,
  // done, aborted, or error event finishes it. Replay preserves this value.
  google.protobuf.Timestamp occurred_at = 9;
}

message SendMessageRequest {
  reserved 5, 6;
  reserved "client_msg_id", "thinking_effort";

  string conversation_id = 1;
  string content = 2;
  // Provider and model used for this turn, decoupled from conversation state.
  string provider_id = 3;
  string model = 4;
}

message SendMessageResponse {
  AgentEvent event = 1;
}

message AbortMessageRequest {
  // User message id from the started event.
  string message_id = 1;
}

message AbortMessageResponse {}

// Stream resumption: the server replays the running turn's events from offset and continues live streaming.
// A turn that is no longer running fails with ERROR_REASON_TURN_NOT_RUNNING.
message ResumeStreamRequest {
  // User message id from the started event.
  string message_id = 1;
  // Number of the turn's stream events the client already received.
  int64 offset = 2;
}

message ResumeStreamResponse {
  AgentEvent event = 1;
}
