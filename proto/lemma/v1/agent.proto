syntax = "proto3";

package lemma.v1;

// Agent execution: send message (server stream), abort, and stream resumption.
service AgentService {
  rpc SendMessage(SendMessageRequest) returns (stream SendMessageResponse);
  rpc AbortMessage(AbortMessageRequest) returns (AbortMessageResponse);
  rpc ResumeStream(ResumeStreamRequest) returns (stream ResumeStreamResponse);
}

message TokenUsage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

message AgentStarted {
  string message_id = 1;
  // Echoes client-generated ID for optimistic rendering and deduplication.
  string client_msg_id = 2;
}

message TextDelta {
  string content = 1;
}

message ThinkingDelta {
  string content = 1;
}

// Structured stream delta: yields one part per event for client-side accumulation by part type.
message AgentDelta {
  oneof part {
    TextDelta text = 1;
    ThinkingDelta thinking = 2;
  }
}

message AgentDone {
  TokenUsage usage = 1;
}

message AgentAborted {}

message AgentError {
  string message = 1;
}

// Marks the start of an assistant turn, emitted per iteration in tool execution loops.
message AgentTurnStarted {
  string message_id = 1;
}

message ToolCallStarted {
  string call_id = 1;
  string name = 2;
  // Invocation arguments formatted as serialized JSON text.
  string arguments = 3;
}

message ToolCallFinished {
  string call_id = 1;
  string name = 2;
  // Tool execution output text.
  string content = 3;
  bool is_error = 4;
}

// Unified stream event.
message AgentEvent {
  oneof kind {
    AgentStarted started = 1;
    AgentDelta delta = 2;
    AgentDone done = 3;
    AgentAborted aborted = 4;
    AgentError error = 5;
    AgentTurnStarted turn_started = 6;
    ToolCallStarted tool_call_started = 7;
    ToolCallFinished tool_call_finished = 8;
  }
}

message SendMessageRequest {
  string conversation_id = 1;
  string content = 2;
  // Provider and model used for this turn, decoupled from conversation state.
  string provider_id = 3;
  string model = 4;
  string client_msg_id = 5;
  // Reasoning effort level; empty string retains the conversation's active configuration.
  string thinking_effort = 6;
}

message SendMessageResponse {
  AgentEvent event = 1;
}

message AbortMessageRequest {
  string message_id = 1;
}

message AbortMessageResponse {}

// Stream resumption: the server replays past content from offset and continues live streaming.
message ResumeStreamRequest {
  string message_id = 1;
  // Character count already received by the client.
  int64 offset = 2;
}

message ResumeStreamResponse {
  AgentEvent event = 1;
}
