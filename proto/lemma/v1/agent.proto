syntax = "proto3";

package lemma.v1;

// Agent 执行：发消息（服务端流）、中断、断线续传
service AgentService {
  rpc SendMessage(SendMessageRequest) returns (stream SendMessageResponse);
  rpc AbortMessage(AbortMessageRequest) returns (AbortMessageResponse);
  rpc ResumeStream(ResumeStreamRequest) returns (stream ResumeStreamResponse);
}

message TokenUsage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

message AgentStarted {
  string message_id = 1;
  // 回显客户端生成 ID，关联乐观渲染与重发去重
  string client_msg_id = 2;
}

message TextDelta {
  string content = 1;
}

message ThinkingDelta {
  string content = 1;
}

// 结构化增量：一次推送一个 part，客户端按 part 类型分别累积
message AgentDelta {
  oneof part {
    TextDelta text = 1;
    ThinkingDelta thinking = 2;
  }
}

message AgentDone {
  TokenUsage usage = 1;
}

message AgentAborted {}

message AgentError {
  string message = 1;
}

// 新一轮 assistant 消息开始（工具循环中每轮一条）
message AgentTurnStarted {
  string message_id = 1;
}

message ToolCallStarted {
  string call_id = 1;
  string name = 2;
  // 调用参数（JSON 序列化文本）
  string arguments = 3;
}

message ToolCallFinished {
  string call_id = 1;
  string name = 2;
  // 工具输出文本
  string content = 3;
  bool is_error = 4;
}

// 统一流事件
message AgentEvent {
  oneof kind {
    AgentStarted started = 1;
    AgentDelta delta = 2;
    AgentDone done = 3;
    AgentAborted aborted = 4;
    AgentError error = 5;
    AgentTurnStarted turn_started = 6;
    ToolCallStarted tool_call_started = 7;
    ToolCallFinished tool_call_finished = 8;
  }
}

message SendMessageRequest {
  string conversation_id = 1;
  string content = 2;
  // 本次回复使用的供应商与模型（模型与会话解耦，随时可换）
  string provider_id = 3;
  string model = 4;
  string client_msg_id = 5;
  // 推理强度；空串表示沿用会话上次使用的设置
  string thinking_effort = 6;
}

message SendMessageResponse {
  AgentEvent event = 1;
}

message AbortMessageRequest {
  string message_id = 1;
}

message AbortMessageResponse {}

// 续传：服务端按 offset 重放缺失内容，流仍在进行则继续实时推送
message ResumeStreamRequest {
  string message_id = 1;
  // 已收到的字符数
  int64 offset = 2;
}

message ResumeStreamResponse {
  AgentEvent event = 1;
}
