syntax = "proto3";

package lemma.v1;

import "google/protobuf/timestamp.proto";

// Provider protocol kind.
enum ProviderKind {
  PROVIDER_KIND_UNSPECIFIED = 0;
  PROVIDER_KIND_OPENAI = 1; // OpenAI Compatible
  PROVIDER_KIND_ANTHROPIC = 2; // Anthropic Messages API
  PROVIDER_KIND_GEMINI = 3; // Gemini Content Generation API
}

// Provider configuration scoped per user account.
message Provider {
  string id = 1;
  ProviderKind kind = 2;
  string name = 3;
  string base_url = 4; // Base URL including API version path, e.g. https://api.openai.com/v1
  string api_key = 5; // Masked when returned in read responses
  repeated string models = 6;
  bool enabled = 7;
  string api_path = 8; // Empty string uses provider kind default
  string models_path = 9; // Empty string defaults to /models
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // Machine identifier visible to users; restricted to ASCII, immutable after creation.
  string identifier = 12;
}

// Explicit wrapper for list update or clearing operations.
message ProviderModelsPatch {
  repeated string models = 1;
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated Provider providers = 1;
}

message CreateProviderRequest {
  ProviderKind kind = 1;
  string name = 2;
  string base_url = 3;
  string api_key = 4;
  repeated string models = 5;
  string api_path = 6;
  string models_path = 7;
  string identifier = 8;
}

message UpdateProviderRequest {
  string id = 1;
  // Updates provided fields while preserving existing configuration.
  optional string name = 2;
  optional string base_url = 3;
  optional string api_key = 4;
  optional bool enabled = 5;
  optional ProviderModelsPatch models = 6;
  optional string api_path = 7;
  optional string models_path = 8;
}

message DeleteProviderRequest {
  string id = 1;
}

message DeleteProviderResponse {}

message FetchModelsRequest {
  // Accepts existing provider id or inline configuration credentials
  string id = 1;
  ProviderKind kind = 2;
  string base_url = 3;
  string api_key = 4;
  string models_path = 5;
}

message FetchModelsResponse {
  repeated string models = 1;
}

message CreateProviderResponse {
  Provider provider = 1;
}

message UpdateProviderResponse {
  Provider provider = 1;
}

service ProviderService {
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc CreateProvider(CreateProviderRequest) returns (CreateProviderResponse);
  rpc UpdateProvider(UpdateProviderRequest) returns (UpdateProviderResponse);
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse);
  // Fetches remote model list from the provider endpoint.
  rpc FetchModels(FetchModelsRequest) returns (FetchModelsResponse);
}
